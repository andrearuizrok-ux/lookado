name: Build LOOKADO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lookado_rebuild/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: lookado_rebuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --no-save \
            @capacitor/core@7.4.3 \
            @capacitor/android@7.4.3 \
            @capacitor/cli@7.4.3

      - name: Build LOOKADO web app
        run: npm run build

      - name: Create stable Capacitor config
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.lookado.app",
            "appName": "LOOKADO",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          cat capacitor.config.json

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          npx cap doctor || true

      - name: Show Android configuration
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          node --version
          npm --version
          npx cap --version
          ls -la android
          ls -la android/app

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: |
          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/LOOKADO-v18.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOOKADO-v18.1-APK
          path: lookado_rebuild/android/app/build/outputs/apk/debug/LOOKADO-v18.1-debug.apk
          if-no-files-found: error
          retention-days: 14
